# Builds and playback-tests the minimal MPD package for Oradio: see
# tools/build-mpd-minimal.sh and tools/test-mpd-minimal.sh.
#
# Runs on a push that changes the build or test script or this workflow, on
# GitHub's arm64 runner in a debian:trixie container, and keeps the result as an
# artifact. A build that fails the playback test leaves no artifact. To use a
# build:
#   1. Download the artifact and check build-info.txt in it.
#   2. Replace the .deb in install_resources/ with the one from the artifact.
#      install_resources/ holds exactly one MPD .deb.
#   3. Set MPD_DEB_TAG in constants.env to the tag in build-info.txt.
# Every build has a newer version (it carries the build date), so devices with
# an older build get the new one on the next oradio_install.sh run.

name: Build minimal MPD

on:
  push:
    paths:
      - tools/build-mpd-minimal.sh
      - tools/test-mpd-minimal.sh
      - .github/workflows/build-mpd-minimal.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build
        id: build
        env:
          # Debian source version, e.g. 0.24.4-1. Empty: current in trixie
          MPD_VERSION: ""
          OUT_DIR: dist
        run: bash tools/build-mpd-minimal.sh

      - name: Keep as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.tag }}
          path: dist/
          if-no-files-found: error
